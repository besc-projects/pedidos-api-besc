name: Deploy to Windows (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, win-defense-besc-runner]
    steps:
      # fetch-depth 1: nao precisamos de historico, so do estado atual.
      # persist-credentials false: sem git ops depois do checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # A API roda sob IIS (httpPlatformHandler, ver web.config) neste
      # diretorio fixo, diferente do workspace do runner. O .env com
      # credenciais reais NAO vai pelo git - fica direto nesse diretorio,
      # preservado pelo robocopy (nao esta em .git nem eh sobrescrito).
      # web.config agora e versionado: o /MIR o mantem sempre atualizado em
      # vez de depender de alguem colocar/manter esse arquivo manualmente no
      # servidor (o que o deixava vulneravel a ser apagado no proximo deploy).
      - name: Sync checkout to app dir and recycle IIS app pool
        shell: powershell
        run: |
          $AppDir = 'C:\Users\cloud\pedidos-api-besc\app'
          robocopy $env:GITHUB_WORKSPACE $AppDir /MIR /XD .git .venv /XF .env /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy falhou (exit $LASTEXITCODE)" }
          Set-Location $AppDir
          ./deploy/recycle-app-pool.ps1
          exit $LASTEXITCODE
