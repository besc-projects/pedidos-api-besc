name: Deploy to Windows (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, win-defense-besc-runner]
    steps:
      # fetch-depth 1: nao precisamos de historico, so do estado atual.
      # persist-credentials false: sem git ops depois do checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # A tarefa agendada que mantem o app no ar (pedidos-api-app) serve sempre
      # deste diretorio fixo, que e diferente do workspace do runner. O .env
      # com credenciais reais NAO vai pelo git - fica direto nesse diretorio,
      # preservado pelo robocopy (nao esta em .git nem eh sobrescrito).
      - name: Sync checkout to app dir and restart service
        shell: powershell
        run: |
          $AppDir = 'C:\Users\cloud\pedidos-api-besc\app'
          robocopy $env:GITHUB_WORKSPACE $AppDir /MIR /XD .git .venv /XF .env /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy falhou (exit $LASTEXITCODE)" }
          Set-Location $AppDir
          ./deploy/restart-service.ps1
          exit $LASTEXITCODE
